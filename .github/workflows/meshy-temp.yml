name: Meshy Temp Auth
on:
  push:
    branches:
      - meshy-temp-onycx-12
  workflow_dispatch:

jobs:
  auth-help:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install -g meshy-cli@0.4.0
      - run: meshy auth login --help
