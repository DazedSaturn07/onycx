name: Meshy Temp Device Start
on:
  push:
    branches:
      - meshy-temp-onycx-12
  workflow_dispatch:

jobs:
  device-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install -g meshy-cli@0.4.0
      - name: Start Meshy device authorization
        run: meshy auth login --device --no-wait
