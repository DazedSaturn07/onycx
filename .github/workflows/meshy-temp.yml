name: Meshy Temp Device Auth
on:
  push:
    branches:
      - meshy-temp-onycx-12
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install -g meshy-cli@0.4.0
      - name: Authorize Meshy
        run: meshy auth login --device
